<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Word Explorer 1000 - Enhanced</title>
  <style>
    :root{--ok:#16a34a;--bad:#dc2626;--ink:#0f172a;--soft:#e2e8f0;--card:rgba(255,255,255,.88)}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--ink);background:
      radial-gradient(1200px 500px at -10% -20%,#c4b5fd 10%,transparent 60%),
      radial-gradient(900px 400px at 120% -10%,#7dd3fc 10%,transparent 58%),
      linear-gradient(145deg,#dbeafe,#dcfce7)}
    .wrap{max-width:980px;margin:auto;padding:14px}
    h2{margin:8px 2px 12px;font-size:clamp(1.25rem,2.4vw,1.8rem);letter-spacing:.2px}
    .card{background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.5);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 10px 30px rgba(15,23,42,.08)}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.badge{background:#f8fafc;border:1px solid #e2e8f0;border-radius:999px;padding:6px 10px;font-weight:700;font-size:.92rem}
    button{border:0;border-radius:12px;padding:10px 13px;background:linear-gradient(180deg,#06b6d4,#0891b2);color:#fff;font-weight:700;cursor:pointer;transition:transform .12s,filter .12s,box-shadow .12s;box-shadow:0 6px 14px rgba(8,145,178,.28)}
    button:hover{filter:brightness(1.05)} button:active{transform:translateY(1px)}
    button.alt{background:linear-gradient(180deg,#818cf8,#6366f1);box-shadow:0 6px 14px rgba(99,102,241,.28)}
    button.warn{background:linear-gradient(180deg,#fbbf24,#f59e0b);box-shadow:0 6px 14px rgba(245,158,11,.28)}
    button.gray{background:linear-gradient(180deg,#94a3b8,#64748b);box-shadow:0 6px 14px rgba(100,116,139,.25)}
    .ghost{background:#fff;color:#0f172a;border:1px solid #cbd5e1;box-shadow:none}
    .q{font-size:1.2rem;font-weight:800;margin:8px 0 10px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .opt{background:#fff;color:#111827;border:2px solid #bfdbfe}.opt:hover{border-color:#38bdf8}
    #result{min-height:26px;font-weight:800}.ok{color:var(--ok)}.bad{color:var(--bad)}
    input[type=text]{padding:11px;border:2px solid #cbd5e1;border-radius:12px;font-size:1rem;width:100%}
    .bar{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#22c55e,#06b6d4);width:0%;transition:.25s}
    .pulse{animation:pulse .35s ease}.shake{animation:shake .35s ease}
    .learn{line-height:1.62}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @keyframes pulse{50%{transform:scale(1.015)}} @keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
    @media(max-width:700px){.opts,.split{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <h2>🎮 Word Explorer · Enhanced Practice</h2>
  <div class="card">
    <b>How to Play</b><br>
    Mixed rounds include: meaning quiz / listen-and-choose / spelling input. Fast feedback, combo, and mistake review are built in.
    <div class="row" style="margin-top:8px">
      <button onclick="start('mix')">Start Mixed Challenge</button>
      <button class="alt" onclick="start('review')">Review Mistakes</button>
      <button class="warn" onclick="showLearn()">Next Learning Card</button>
      <button class="gray" onclick="resetAll()">Reset</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <span class="badge" id="statMode">Mode: Learn</span>
      <span class="badge" id="statQ">Question: 0/0</span>
      <span class="badge" id="statC">Correct: 0</span>
      <span class="badge" id="statM">Mistakes: 0</span>
      <span class="badge" id="statCombo">Combo: 0🔥</span>
    </div>
    <div class="bar" style="margin-top:8px"><div class="fill" id="progress"></div></div>
  </div>

  <div class="card" id="qaCard">
    <div class="q" id="q">Loading word bank...</div>
    <div id="answerArea"></div>
    <div id="result"></div>
  </div>

  <div class="card learn" id="learnCard"></div>
</div>

<script>
let WORDS=[], withZh=[], idx=0, set=[], qi=0, correct=0, combo=0, mode='learn', mistakes=JSON.parse(localStorage.getItem('pet1000_mistakes')||'[]'), cur=null;
const $=id=>document.getElementById(id);

function beep(type='ok'){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.type='sine';o.frequency.value=type==='ok'?760:260;g.gain.value=.03;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.08);}catch(e){}}
function speak(word){const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.95;speechSynthesis.cancel();speechSynthesis.speak(u)}
function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
function pick(a,n){return shuffle(a).slice(0,n)}
function boldWord(text,word){const re=new RegExp(`\\b(${word})\\b`,'gi');return text.replace(re,'<b>$1</b>')}

fetch('./pet-words-1000-meta.json').then(r=>r.json()).then(data=>{WORDS=data;withZh=WORDS.filter(x=>x.zh);$('q').textContent='Word bank ready (1000 words). Click "Start Mixed Challenge".';showLearn();});

function stats(total=0){
  $('statMode').textContent='Mode: '+(mode==='mix'?'Challenge':mode==='review'?'Review':'Learn');
  $('statQ').textContent=`Question: ${Math.min(qi,total)}/${total}`;
  $('statC').textContent=`Correct: ${correct}`;
  $('statM').textContent=`Mistakes: ${mistakes.length}`;
  $('statCombo').textContent=`Combo: ${combo}🔥`;
  $('progress').style.width=total?`${Math.min(100,(qi/total)*100)}%`:'0%';
}

function renderCard(w){
  const ex1=(w.examples&&w.examples[0])||{en:`This is ${w.word}.`,zh:`这是 ${w.word}。`};
  const ex2=(w.examples&&w.examples[1])||{en:`They used ${w.word} in a harder task.`,zh:`他们在更难任务中使用了 ${w.word}。`};
  $('learnCard').innerHTML=`<b>Learning Card</b><br>
  Word: <b>${w.word}</b> <button class='ghost' onclick="speak('${w.word}')">🔊 Pronounce</button><br>
  POS: ${w.pos||'n.'} | IPA: ${w.ipa||`/${w.word}/`}<br>
  Meaning: ${w.zh||'N/A'}
  <div class='split' style='margin-top:8px'>
    <div style='padding:8px;background:#f8fafc;border-left:3px solid #7dd3fc'><b>Example 1 (Simple)</b><br><b>EN</b>: ${boldWord(ex1.en,w.word)}<br><b>中文</b>: ${ex1.zh||''}</div>
    <div style='padding:8px;background:#faf5ff;border-left:3px solid #c4b5fd'><b>Example 2 (Advanced)</b><br><b>EN</b>: ${boldWord(ex2.en,w.word)}<br><b>中文</b>: ${ex2.zh||''}</div>
  </div>`;
}

function showLearn(){if(!WORDS.length)return;mode='learn';const w=WORDS[idx%WORDS.length];idx++;$('q').textContent='📘 Learning Word: '+w.word;$('answerArea').innerHTML='';$('result').textContent='';renderCard(w);stats(0)}

function makeQ(word){
  const type=['meaning','listen','spell'][Math.floor(Math.random()*3)];
  if(type==='meaning'&&word.zh){const opts=shuffle([word.zh,...pick(withZh.filter(x=>x.word!==word.word).map(x=>x.zh),3)]);return {type,word,opts,answer:word.zh};}
  if(type==='listen'){const opts=shuffle([word.word,...pick(WORDS.filter(x=>x.word!==word.word).map(x=>x.word),3)]);return {type:'listen',word,opts,answer:word.word};}
  return {type:'spell',word,answer:word.word};
}

function render(){
  const total=set.length;
  if(qi>=total){$('q').textContent=`🎉 Completed: ${correct}/${total}`;$('answerArea').innerHTML='';$('result').innerHTML='<span class="ok">Great! Do a mistake review round.</span>';stats(total);return}
  cur=makeQ(set[qi]);
  if(cur.type==='meaning'){$('q').textContent=`${qi+1}. ${cur.word.word} — choose the correct meaning:`;$('answerArea').innerHTML=`<div class='opts'>${cur.opts.map(o=>`<button class='opt' onclick="ans('${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}</div>`}
  else if(cur.type==='listen'){$('q').innerHTML=`${qi+1}. Listen and choose <button class='ghost' onclick="speak('${cur.word.word}')">🔊 Play</button>`;$('answerArea').innerHTML=`<div class='opts'>${cur.opts.map(o=>`<button class='opt' onclick="ans('${o}')">${o}</button>`).join('')}</div>`;setTimeout(()=>speak(cur.word.word),180)}
  else{const hint=cur.word.word[0]+' _ '.repeat(Math.max(cur.word.word.length-2,1))+cur.word.word.slice(-1);$('q').textContent=`${qi+1}. Spell this word (hint: ${hint})`;$('answerArea').innerHTML=`<input id='spellInput' type='text' placeholder='Type the full word' onkeydown="if(event.key==='Enter')submitSpell()"/><div style='margin-top:8px' class='row'><button onclick='submitSpell()'>Submit</button><button class='ghost' onclick="speak('${cur.word.word}')">🔊 Hear Again</button></div>`}
  $('result').textContent='';renderCard(cur.word);stats(total)
}

function markMistake(w){if(!mistakes.find(x=>x.word===w.word)){mistakes.push(w);localStorage.setItem('pet1000_mistakes',JSON.stringify(mistakes));}}
function fx(ok){const card=$('qaCard');card.classList.remove('pulse','shake');void card.offsetWidth;card.classList.add(ok?'pulse':'shake');beep(ok?'ok':'bad')}
function ans(v){const ok=v===cur.answer;if(ok){correct++;combo++;$('result').innerHTML=`<span class='ok'>✅ Correct! +1 (${combo} combo)</span>`;fx(true)}else{combo=0;$('result').innerHTML=`<span class='bad'>❌ Correct answer: ${cur.answer}</span>`;markMistake(cur.word);fx(false)}qi++;stats(set.length);setTimeout(render,450)}
function submitSpell(){const v=($('spellInput').value||'').trim().toLowerCase();ans(v)}

function start(m){if(!WORDS.length)return;mode=m==='review'?'review':'mix';qi=0;correct=0;combo=0;set=mode==='review'?(mistakes.length?pick(mistakes,Math.min(20,mistakes.length)):[]):pick(WORDS,20);if(mode==='review'&&!set.length){$('q').textContent='No mistakes yet. Start a challenge first.';$('answerArea').innerHTML='';$('result').textContent='';stats(0);return}render()}
function resetAll(){if(!confirm('Confirm reset?'))return;mistakes=[];localStorage.removeItem('pet1000_mistakes');qi=0;correct=0;combo=0;showLearn()}
window.start=start;window.showLearn=showLearn;window.resetAll=resetAll;window.speak=speak;window.ans=ans;window.submitSpell=submitSpell;
</script>
</body>
</html>

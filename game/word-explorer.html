<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Word Explorer 1000</title>
  <style>
    body{margin:0;font-family:Arial,"PingFang SC",sans-serif;background:linear-gradient(135deg,#8ee3ff,#c8f7dc);color:#1f2937}
    .wrap{max-width:980px;margin:auto;padding:12px}
    .card{background:#fff;border-radius:14px;padding:12px;margin:10px 0;box-shadow:0 6px 18px rgba(0,0,0,.08)}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    .badge{background:#f3f4f6;border-radius:999px;padding:6px 10px;font-weight:700}
    button{border:0;border-radius:10px;padding:10px 12px;background:#14b8a6;color:#fff;font-weight:700}
    button.alt{background:#6366f1} button.warn{background:#f59e0b} button.gray{background:#6b7280}
    .q{font-size:1.2rem;font-weight:800;margin:8px 0}
    .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .opt{background:#fff;color:#111827;border:2px solid #bfdbfe}
    #result{min-height:24px;font-weight:800}
    .ok{color:#16a34a}.bad{color:#dc2626}
    input[type=text]{padding:10px;border:2px solid #cbd5e1;border-radius:10px;font-size:1rem;width:100%}
    @media(max-width:680px){.opts{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <h2>🎮 Word Explorer（快版）· 1000词挑战</h2>
  <div class="card">
    <b>玩法说明</b><br>
    1) 题型随机：词义选择 / 听音选词 / 拼写填空。<br>
    2) 学习卡片含：词性、音标（快版先占位）、发音按钮（浏览器语音）。<br>
    3) 错题自动记录，可反复复习。
    <div class="row" style="margin-top:8px">
      <button onclick="start('mix')">开始混合挑战</button>
      <button class="alt" onclick="start('review')">错题复习</button>
      <button class="warn" onclick="showLearn()">学习下一词</button>
      <button class="gray" onclick="resetAll()">重置</button>
    </div>
  </div>

  <div class="card row">
    <span class="badge" id="statMode">模式：学习</span>
    <span class="badge" id="statQ">题目：0/0</span>
    <span class="badge" id="statC">正确：0</span>
    <span class="badge" id="statM">错题：0</span>
  </div>

  <div class="card">
    <div class="q" id="q">加载词库中...</div>
    <div id="answerArea"></div>
    <div id="result"></div>
  </div>

  <div class="card" id="learnCard"></div>
</div>

<script>
let WORDS=[], withZh=[], idx=0, set=[], qi=0, correct=0, mode='learn', mistakes=JSON.parse(localStorage.getItem('pet1000_mistakes')||'[]'), cur=null;
const $=id=>document.getElementById(id);

fetch('./pet-words-1000.json').then(r=>r.json()).then(data=>{
  WORDS=data; withZh=WORDS.filter(x=>x.zh);
  $('q').textContent='词库已就绪（1000词）。点击“开始混合挑战”。';
  showLearn();
});

function speak(word){
  const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=0.9; speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
function pick(a,n){return shuffle(a).slice(0,n)}
function stats(total=0){$('statMode').textContent='模式：'+(mode==='mix'?'挑战':mode==='review'?'复习':'学习');$('statQ').textContent=`题目：${Math.min(qi,total)}/${total}`;$('statC').textContent=`正确：${correct}`;$('statM').textContent=`错题：${mistakes.length}`}
function card(w){$('learnCard').innerHTML=`<b>学习卡片</b><br>单词：<b>${w.word}</b> <button onclick="speak('${w.word}')">🔊 发音</button><br>词性：${w.pos||'待补充'}<br>音标：${w.ipa||'待补充'}<br>词义：${w.zh||'快版暂未补全'}<br>例句：This is a <b>${w.word}</b>.`;}
function showLearn(){if(!WORDS.length)return;mode='learn';const w=WORDS[idx%WORDS.length];idx++;$('q').textContent='📘 学习词：'+w.word;$('answerArea').innerHTML='';$('result').textContent='';card(w);stats(0)}

function makeQ(word){
  const type = ['meaning','listen','spell'][Math.floor(Math.random()*3)];
  if(type==='meaning' && word.zh){
    const opts=shuffle([word.zh,...pick(withZh.filter(x=>x.word!==word.word).map(x=>x.zh),3)]);
    return {type,word,opts,answer:word.zh};
  }
  if(type==='listen'){
    const opts=shuffle([word.word,...pick(WORDS.filter(x=>x.word!==word.word).map(x=>x.word),3)]);
    return {type:'listen',word,opts,answer:word.word};
  }
  return {type:'spell',word,answer:word.word};
}

function render(){
  const total=set.length;
  if(qi>=total){$('q').textContent=`🎉 完成：${correct}/${total}`;$('answerArea').innerHTML='';$('result').innerHTML='<span class="ok">建议：做一轮错题复习</span>';stats(total);return;}
  cur=makeQ(set[qi]);
  if(cur.type==='meaning'){
    $('q').textContent=`${qi+1}. ${cur.word.word} 的中文是？`;
    $('answerArea').innerHTML=`<div class="opts">${cur.opts.map(o=>`<button class='opt' onclick="ans('${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}</div>`;
  }else if(cur.type==='listen'){
    $('q').innerHTML=`${qi+1}. 听发音选择单词 <button onclick="speak('${cur.word.word}')">🔊 播放</button>`;
    $('answerArea').innerHTML=`<div class="opts">${cur.opts.map(o=>`<button class='opt' onclick="ans('${o}')">${o}</button>`).join('')}</div>`;
    setTimeout(()=>speak(cur.word.word),200);
  }else{
    const hint=cur.word.word[0]+' _ '.repeat(Math.max(cur.word.word.length-2,1))+cur.word.word.slice(-1);
    $('q').textContent=`${qi+1}. 拼写这个词（提示：${hint}）`;
    $('answerArea').innerHTML=`<input id='spellInput' type='text' placeholder='输入完整单词'/><div style='margin-top:8px'><button onclick='submitSpell()'>提交</button></div>`;
  }
  $('result').textContent='';card(cur.word);stats(total);
}

function markMistake(w){ if(!mistakes.find(x=>x.word===w.word)){mistakes.push(w);localStorage.setItem('pet1000_mistakes',JSON.stringify(mistakes));}}
function ans(v){const ok=v===cur.answer; if(ok){correct++;$('result').innerHTML='<span class="ok">✅ 正确</span>';}else{$('result').innerHTML=`<span class='bad'>❌ 正确答案：${cur.answer}</span>`;markMistake(cur.word);}qi++;stats(set.length);setTimeout(render,500)}
function submitSpell(){const v=($('spellInput').value||'').trim().toLowerCase();ans(v)}

function start(m){
  if(!WORDS.length)return;
  mode=m==='review'?'review':'mix';qi=0;correct=0;
  set = mode==='review' ? (mistakes.length?pick(mistakes,Math.min(20,mistakes.length)):[]) : pick(WORDS,20);
  if(mode==='review' && !set.length){$('q').textContent='还没有错题，先开始挑战。';$('answerArea').innerHTML='';$('result').textContent='';stats(0);return;}
  render();
}
function resetAll(){if(!confirm('确认重置？'))return;mistakes=[];localStorage.removeItem('pet1000_mistakes');qi=0;correct=0;showLearn();}
window.start=start;window.showLearn=showLearn;window.resetAll=resetAll;window.speak=speak;window.ans=ans;window.submitSpell=submitSpell;
</script>
</body>
</html>

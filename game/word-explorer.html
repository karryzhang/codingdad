<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Explorer</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f8ff; overflow: hidden; }
        #gameCanvas { display: block; margin: 0 auto; background: #b0e0e6; width: 100%; height: 80vh; }
        .word { position: absolute; padding: 10px; background: #ffffff; border: 2px solid #87cefa; border-radius: 5px; }
        .message { text-align: center; padding: 10px; }
        button { padding: 10px 20px; margin-top: 10px; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div class="message" id="messageBox"></div>
    <script>
        const words = ["apple", "banana", "grape", "orange", "strawberry"];
        let currentWordIndex = 0;

        // Initialize canvas
        const canvas = document.getElementById('gameCanvas');
        const context = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight * 0.8;

        function drawWord() {
            context.clearRect(0, 0, canvas.width, canvas.height);
            context.font = '48px serif';
            context.textAlign = 'center';
            context.fillText(words[currentWordIndex], canvas.width / 2, canvas.height / 2);
        }

        function nextWord() {
            currentWordIndex++;
            if (currentWordIndex >= words.length) {
                document.getElementById('messageBox').innerHTML = 'You completed the game! Good job!';
            } else {
                drawWord();
            }
        }

        // Initialize the game
        drawWord();

        // Listen for space key press to move to the next word
        window.addEventListener('keydown', function(event) {
            if (event.code === 'Space') {
                nextWord();
            }
        });
    </script>
</body>
</html>
